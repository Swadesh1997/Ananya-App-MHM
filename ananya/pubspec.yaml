name: ananya
description: "A new Flutter project."
publish_to: "none"

version: 4.3.0+35

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.3.3
  google_fonts: ^6.2.1
  http: ^1.2.1
  youtube_player_flutter: ^9.0.3
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.1.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: 0.20.2
  rxdart: ^0.27.4
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.4
  flutter_pdfview: ^1.3.2
  webview_flutter: ^4.9.0

  lottie: ^3.1.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^2.25.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.5
  in_app_update: ^4.2.3

  timezone: any
  flutter_timezone: ^3.0.1
dev_dependencies:
  # Build-time tooling only — invoked by hand, never imported by the app.
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  # Padded copy of logo.png: adaptive icons only guarantee the centre ~66% is
  # visible, so the logo is inset to avoid being cropped by the launcher mask.
  adaptive_icon_foreground: "assets/images/logo_adaptive_foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/gif/
    - assets/pdf/
    - assets/json/
    - assets/images/setyourcalendar.png
    - assets/images/viewmap.png
    - assets/images/chatbot.png
